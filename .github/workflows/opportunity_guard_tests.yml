name: Validate Opportunity Gate

on:
  pull_request:
    paths:
      - 'src/**'
      - 'tests/test_opportunity_guard.py'
      - 'tests/test_source_expansion.py'
      - 'tests/test_publication_queue.py'
      - '.github/workflows/opportunity_guard_tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test opportunity deadline and editorial gate
        run: |
          python -m unittest discover -s tests -p 'test_opportunity_guard.py' -v
          python -m unittest discover -s tests -p 'test_source_expansion.py' -v
          python -m unittest discover -s tests -p 'test_publication_queue.py' -v
