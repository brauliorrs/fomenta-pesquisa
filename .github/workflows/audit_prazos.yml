name: Auditar Prazos de Inscricao

on:
  workflow_dispatch:
  # Atualizacoes do workflow executam auditoria e revisam intervalos sem loops;
  # o relatorio JSON gravado pela rotina nao dispara a mesma acao.
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit_prazos.yml'
  schedule:
    # 09h20 no horario de Brasilia (12h20 UTC).
    - cron: "20 12 * * *"

concurrency:
  group: deadline-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_deadline_evidence.py' -v
          python -m unittest discover -s tests -p 'test_opportunity_guard.py' -v
      - name: Audit original registered URLs
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Sao_Paulo' }}
        run: python -m src.audit_deadlines
      - name: Persist audit report without publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auditoria_prazos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: prazos de inscricao $(date -u +'%Y-%m-%d %H:%M')"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            git fetch origin main
            git pull --rebase origin main
          done
          test "$pushed" = "true"
