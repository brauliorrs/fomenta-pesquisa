name: Auditar Prazos de Inscricao

on:
  workflow_dispatch:
  # Etapa 2: prioriza revisao dos URLs ainda sem leitura, reprocessa ambiguidades e diagnostica HTTP;
  # o relatorio JSON gravado pela rotina nao dispara a mesma acao.
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit_prazos.yml'
      - 'data/confrontos_oficiais_etapa2.json'
      - 'src/services/deadline_evidence.py'
      - 'src/services/deadline_audit_service.py'
      - 'src/services/stage2_inventory.py'
      - 'src/services/source_triage.py'
      - 'src/services/deadline_candidates.py'
      - 'src/services/p1_operational_report.py'
      - 'src/audit_deadlines.py'
  schedule:
    # 09h20 no horario de Brasilia (12h20 UTC).
    - cron: "20 12 * * *"

concurrency:
  group: deadline-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p 'test_deadline_evidence.py' -v
          python -m unittest discover -s tests -p 'test_opportunity_guard.py' -v
          python -m unittest discover -s tests -p 'test_stage2_inventory.py' -v
      - name: Audit original registered URLs
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Sao_Paulo' }}
        run: python -m src.audit_deadlines
      - name: Resumo operacional P1 por instituicao
        run: |
          python - <<'PY'
          import json, os
          with open('data/relatorio_p1_operacional.json', encoding='utf-8') as f:
              r = json.load(f)
          lines = [
              '## P1 — Auditoria de prazos sem publicacao',
              f"- Gerado em: {r['gerado_em']}",
              f"- Elegiveis consultados: {r['visitados_elegiveis']}/{r['elegiveis_para_visita']}",
              f"- Pendentes elegiveis: {r['pendentes_de_visita_elegiveis']}",
              f"- Excluidos por filtro editorial ou listagem: {r['excluidos_da_visita_por_filtro_editorial']}",
              f"- Primeiras visitas neste ciclo: {r['novos_links_visitados_nesta_execucao']}",
              f"- Acessos recuperados neste ciclo: {r['falhas_de_acesso_recuperadas_nesta_execucao']}",
              f"- Falhas de acesso/formato: {r['erros_de_acesso_ou_formato_atuais']}",
              f"- Sem prazo extraivel do documento: {r['fontes_sem_prazo_extraivel_atuais']}",
              '- Este job nao altera editais, flags, filas nem autoriza Instagram.',
          ]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines) + '\n')
          print(' | '.join(lines[1:9]))
          PY
      - name: Persist audit report without publishing
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/auditoria_prazos.json data/inventario_sem_prazo_etapa2.json data/relatorio_p1_operacional.json data/candidatos_recuperacao_prazos.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: prazos de inscricao $(date -u +'%Y-%m-%d %H:%M')"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            git fetch origin main
            git pull --rebase origin main
          done
          test "$pushed" = "true"
