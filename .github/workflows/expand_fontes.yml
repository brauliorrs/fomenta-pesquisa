name: Expandir Corpus de Fontes

on:
  workflow_dispatch:
  schedule:
    # Diariamente, 07h30 no Brasil (10h30 UTC)
    - cron: "30 10 * * *"

concurrency:
  group: discover-fontes
  cancel-in-progress: false

jobs:
  expand-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test source expansion and editorial safety
        run: |
          python -m unittest discover -s tests -p 'test_source_expansion.py' -v
          python -m unittest discover -s tests -p 'test_opportunity_guard.py' -v
      - name: Expand discoverable pages
        env:
          TIMEZONE: ${{ vars.TIMEZONE || 'America/Sao_Paulo' }}
        run: python -m src.expand_sources
      - name: Persist corpus registry
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fontes.json data/fontes_candidatas.json data/fontes_expansao.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "discover: expandir corpus $(date -u +'%Y-%m-%d %H:%M')"
          pushed=false
          for attempt in 1 2 3; do
            if git push; then
              pushed=true
              break
            fi
            git fetch origin main
            git pull --rebase origin main
          done
          test "$pushed" = "true"
